[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-ratelimit"
version = "0.11.1"
description = "Asas rate-limiting module: a token-bucket engine with named, host-declared rules, a FastAPI-native 429 check, an overrides-string parser for per-deployment tuning, and a pluggable bucket store (in-memory by default, Redis for several replicas)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.110,<1",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest>=8",
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_ratelimit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
