[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-ratelimit"
version = "0.12.0"
description = "Asas rate-limiting module: a token-bucket engine with named, host-declared rules, a FastAPI-native 429 check, an overrides-string parser, and an optional host-injected shared bucket (with a ready Redis adapter) for one budget across replicas."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
]
dependencies = [
    "fastapi>=0.110,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "redis>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_ratelimit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
