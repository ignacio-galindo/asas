[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asas-llm"
version = "0.1.0"
description = "Asas LLM module: provider-agnostic model-call helpers - strict structured-output schemas, reply parsing with typed errors, retries with timeouts and Retry-After, usage accounting, trace nesting, a cached prompt registry, and media redaction for traces."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
repair = [
    "json-repair>=0.25",
]
dev = [
    "pytest>=8",
    "json-repair>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asas_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
